name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (if available)
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script"; fi

      - name: Build (if available)
        run: |
          if npm run | grep -q "build"; then npm run build --if-present; else echo "No build script"; fi

      - name: Run tests (if available)
        env:
          CI: true
        run: |
          if npm run | grep -q "test"; then npm test -- --watchAll=false; else echo "No test script"; fi
